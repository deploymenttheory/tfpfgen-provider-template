# Regenerates this provider from the API's OpenAPI document, optionally
# recording fresh evidence from the live API first.
#
# WHAT TO FILL IN
#
#   The very first run:  paste the OpenAPI document's URL into `openapi_url`.
#   Every run after:     nothing. Press the button.
#
#   The other inputs are all optional overrides, and the form says so on each
#   one. Leaving them empty is the normal answer, because everything they would
#   set is already recorded in the repository -- the SDK's own lock file
#   remembers how it was built, and the pinned document remembers where it came
#   from. A setting a person retypes every run is a setting that will one day be
#   typed wrong.
#
# WHAT IT DOES
#
#   Two jobs, in order.
#
#   Probe (only when you ask for it) exercises each resource against a sandbox
#   tenant and records what the API actually did. This is the only part that
#   touches a live system, which is why it is off by default and why the
#   credentials are declared on that job alone.
#
#   Generate pins the API document, generates a Go SDK from it, works out the
#   provider's shape, writes the provider's code, then compiles and unit-tests
#   the result. Whatever the probe just recorded -- and whatever was recorded on
#   earlier runs -- is folded in on the way past.
#
#   They are one workflow because they are one story: evidence and the provider
#   it changes arrive in the same pull request, rather than in two that somebody
#   has to merge in the right order. Nothing is committed to the default branch
#   directly, and a run that finds nothing changed says so and proposes nothing.
name: tfpfgen | Pipeline

on:
  workflow_dispatch:
    inputs:
      probe_the_live_api_first:
        description: 'Creates and deletes real objects in the sandbox tenant to learn how the API actually behaves, then folds what it saw into this run. Off by default.'
        required: false
        default: false
        type: boolean
      probe_only_this_resource:
        description: 'Only used when probing. Leave empty to probe everything that is ready; or name one resource -- its blueprint file name without the extension, e.g. tag.'
        required: false
        type: string
      probe_re_record_existing:
        description: 'Only used when probing. Off by default, so a run fills gaps and leaves evidence it already has alone. Turn on to record everything again.'
        required: false
        default: false
        type: boolean
      tfpfgen_version_override:
        description: 'Leave empty. Runs the generator at a different version than config.json names, for testing an unreleased change without committing it.'
        required: false
        type: string

# Read-only by default; the job that opens the pull request asks for more.
permissions:
  contents: read

concurrency:
  group: tfpfgen-pipeline-${{ github.repository }}
  cancel-in-progress: false

jobs:
  # ---------------------------------------------------------------------------
  # Record what the live API actually does. Opt-in, and the only job that holds
  # the tenant's credentials -- a job that does not declare a secret cannot leak
  # one, so generation runs without them even on a run that probes.
  # ---------------------------------------------------------------------------
  probe:
    name: '🔬 Record live-API evidence'
    if: ${{ inputs.probe_the_live_api_first }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - name: Check Out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Read config.json
        # The one file a person edits. Everything the pipeline needs to know
        # about this API lives here, committed and reviewable, rather than in a
        # dispatch form somebody retypes each run -- a setting typed per run is
        # a setting that will one day be typed wrong.
        env:
          REPO_NAME: ${{ github.event.repository.name }}
          TFPFGEN_OVERRIDE: ${{ inputs.tfpfgen_version_override }}
        run: |
          if [ ! -f config.json ]; then
            echo "::error::config.json is missing. It names the API document to generate from; see CONFIGURING.md"
            exit 1
          fi
          if ! jq empty config.json 2>/dev/null; then
            echo "::error::config.json is not valid JSON"
            exit 1
          fi

          NAME=$(jq -r '.provider.name // empty' config.json)
          NAME="${NAME:-${REPO_NAME#terraform-provider-}}"

          DOC_URL=$(jq -r '.openapi.documentUrl // empty' config.json)
          if [ -z "${DOC_URL}" ] || [ "${DOC_URL}" = "PLACEHOLDER" ]; then
            if [ ! -d "openapi/${NAME}" ]; then
              echo "::error::config.json does not name an OpenAPI document (openapi.documentUrl) and no snapshot is pinned yet; see CONFIGURING.md"
              exit 1
            fi
            # Already pinned once: the snapshot records where it came from, so
            # an empty URL means "re-fetch from that" rather than an error.
            DOC_URL=""
          fi

          {
            echo "PROVIDER_NAME=${NAME}"
            echo "OPENAPI_DIR=openapi/${NAME}"
            echo "BLUEPRINT_DIR=blueprints/${NAME}"
            echo "OPENAPI_URL=${DOC_URL}"
            echo "SDK_CLIENT_NAME=$(jq -r '.sdk.clientTypeName // "ApiClient"' config.json)"
            echo "SDK_INCLUDE=$(jq -r '(.sdk.includeOnlyPaths // []) | join(",")' config.json)"
            echo "SDK_EXCLUDE=$(jq -r '(.sdk.skipPaths // []) | join(",")' config.json)"
            echo "KIOTA_VERSION=$(jq -r '.sdk.kiotaVersion // empty' config.json)"
            echo "KIOTA_SHA256=$(jq -r '.sdk.kiotaDownloadChecksum // empty' config.json)"
            echo "TFPFGEN_REF=${TFPFGEN_OVERRIDE:-$(jq -r '.generator.version // "main"' config.json)}"
            echo "PROBE_NAME_PREFIX=$(jq -r '.probe.namePrefix // "tfpfgen-probe"' config.json)"
            echo "PROBE_MAX_OBJECTS=$(jq -r '.probe.maxExistingObjects // 25' config.json)"
            echo "PROBE_SCOPE_PARAM=$(jq -r '.probe.accountScopeParam // empty' config.json)"
            echo "PROBE_SCOPE_JSONPATH=$(jq -r '.probe.accountScopeJsonPath // empty' config.json)"
            echo "PROBE_AUTH_METHOD=$(jq -r '.probe.authMethod // "bearerToken"' config.json)"
            echo "PROBE_TOKEN_URL=$(jq -r '.probe.tokenUrl // .auth.tokenUrl // empty' config.json)"
            echo "PROBE_SECRET_TOKEN=$(jq -r '.probe.secrets.token // "TFPFGEN_PROBE_TOKEN"' config.json)"
            echo "PROBE_SECRET_CLIENT_ID=$(jq -r '.probe.secrets.clientId // "TFPFGEN_PROBE_CLIENT_ID"' config.json)"
            echo "PROBE_SECRET_CLIENT_SECRET=$(jq -r '.probe.secrets.clientSecret // "TFPFGEN_PROBE_CLIENT_SECRET"' config.json)"
            echo "PROBE_SECRET_USERNAME=$(jq -r '.probe.secrets.username // "TFPFGEN_PROBE_USERNAME"' config.json)"
            echo "PROBE_SECRET_PASSWORD=$(jq -r '.probe.secrets.password // "TFPFGEN_PROBE_PASSWORD"' config.json)"
          } >> "$GITHUB_ENV"
          echo "provider=${NAME} document=${DOC_URL:-<re-fetch from the pinned snapshot>}"

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Install tfpfgen
        env:
          GOPRIVATE: github.com/deploymenttheory/terraform-plugin-framework-codegen
        run: |
          go install "github.com/deploymenttheory/terraform-plugin-framework-codegen/cmd/tfpfgen@${TFPFGEN_REF}"
          tfpfgen version

      - name: Materialise the sandbox profile
        # Written fresh from secrets, never committed, deleted before the
        # artifact is packed. The token itself stays in the environment -- the
        # guard scans the profile and refuses one that embeds a credential.
        env:
          ENDPOINT: ${{ secrets.TFPFGEN_PROBE_ENDPOINT }}
          EVIDENCE: ${{ secrets.TFPFGEN_SANDBOX_EVIDENCE }}
          AID: ${{ secrets.TFPFGEN_ACCOUNT_GROUP_ID }}
          TOKEN: ${{ secrets.TFPFGEN_PROBE_TOKEN }}
          CLIENT_ID: ${{ secrets.TFPFGEN_PROBE_CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.TFPFGEN_PROBE_CLIENT_SECRET }}
          USERNAME: ${{ secrets.TFPFGEN_PROBE_USERNAME }}
          PASSWORD: ${{ secrets.TFPFGEN_PROBE_PASSWORD }}
        run: |
          # Which credential secrets matter depends on how config.json says
          # this API authenticates: demanding a token from an API that issues
          # none would refuse a run that was correctly configured. Named by
          # the secret a person would create, and all at once -- being told
          # about one missing secret per run is several runs to learn the same
          # thing.
          missing=()
          case "${PROBE_AUTH_METHOD}" in
            clientCredentials)
              [ -z "${CLIENT_ID}" ]     && missing+=("${PROBE_SECRET_CLIENT_ID}")
              [ -z "${CLIENT_SECRET}" ] && missing+=("${PROBE_SECRET_CLIENT_SECRET}")
              ;;
            usernamePassword)
              [ -z "${USERNAME}" ] && missing+=("${PROBE_SECRET_USERNAME}")
              [ -z "${PASSWORD}" ] && missing+=("${PROBE_SECRET_PASSWORD}")
              ;;
            *)
              [ -z "${TOKEN}" ] && missing+=("${PROBE_SECRET_TOKEN}")
              ;;
          esac
          [ -z "${ENDPOINT}" ] && missing+=("TFPFGEN_PROBE_ENDPOINT")
          [ -z "${EVIDENCE}" ] && missing+=("TFPFGEN_SANDBOX_EVIDENCE")
          [ -z "${AID}" ]      && missing+=("TFPFGEN_ACCOUNT_GROUP_ID")
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::the probe authenticates by ${PROBE_AUTH_METHOD} and needs repository secrets that are not set: ${missing[*]}. Add them under Settings -> Secrets and variables -> Actions, or leave 'probe the live api first' unticked to skip this job. CONFIGURING.md explains what each one is."
            exit 1
          fi
          HOST=$(printf '%s' "$ENDPOINT" | sed -E 's|^https?://([^/]+).*|\1|')
          mkdir -p .tfpfgen/sandbox
          jq -n --arg endpoint "$ENDPOINT" --arg evidence "$EVIDENCE" \
                --arg host "$HOST" --arg aid "$AID" \
                --arg prefix "$PROBE_NAME_PREFIX" --arg max "$PROBE_MAX_OBJECTS" \
                --arg param "$PROBE_SCOPE_PARAM" --arg jsonpath "$PROBE_SCOPE_JSONPATH" \
                --arg method "$PROBE_AUTH_METHOD" --arg token_url "$PROBE_TOKEN_URL" \
                --arg s_token "$PROBE_SECRET_TOKEN" \
                --arg s_client_id "$PROBE_SECRET_CLIENT_ID" \
                --arg s_client_secret "$PROBE_SECRET_CLIENT_SECRET" \
                --arg s_username "$PROBE_SECRET_USERNAME" \
                --arg s_password "$PROBE_SECRET_PASSWORD" '{
            endpoint: $endpoint,
            authMethod: $method,
            sandbox: true,
            sandboxEvidence: $evidence,
            namePrefix: $prefix,
            assertions: ({
              endpointHostSuffix: $host,
              maxExistingObjects: ($max | tonumber),
              accountGroupId: $aid
            }
            + (if $param == "" then {} else {accountGroupParam: $param} end)
            + (if $jsonpath == "" then {} else {accountGroupJsonPath: $jsonpath} end))
          }
          + (if $method == "clientCredentials" then
               {clientIdEnv: $s_client_id, clientSecretEnv: $s_client_secret, tokenUrl: $token_url}
             elif $method == "usernamePassword" then
               {usernameEnv: $s_username, passwordEnv: $s_password}
             else {tokenEnv: $s_token} end)' > ".tfpfgen/sandbox/${PROVIDER_NAME}.json"
          echo "profile written for ${HOST}"

      - name: Draft scenarios for resources that lack one
        # The scenario names the fixtures and candidates a probe cannot
        # discover. Drafting fills what the blueprint derives and marks the
        # rest CURATE_ME; only a draft with nothing left to curate is promoted,
        # and every one still carrying a marker is skipped by name. That is the
        # stated fidelity limit of an unattended probe: influencer-gated
        # conditional behaviour stays undiscovered until the drafter learns to
        # derive it.
        run: |
          SCRATCH=$(mktemp -d)
          tfpfgen blueprint draft -openapi-dir "${OPENAPI_DIR}" \
            -sdk-dialect kiotaFluent \
            -sdk-models-package "$(go list -m)/internal/sdk/models" \
            -out "$(mktemp -d)" \
            -scenario-drafts "$SCRATCH" || true
          promoted=0
          for draft in "$SCRATCH"/*.scenario.draft.json; do
            [ -e "$draft" ] || continue
            key=$(basename "$draft" .scenario.draft.json)
            target="${BLUEPRINT_DIR}/${key}.scenario.json"
            if [ -e "$target" ]; then
              continue
            fi
            if grep -q "CURATE_ME" "$draft"; then
              echo "skipped   ${key}: the drafted scenario still carries CURATE_ME markers"
              continue
            fi
            cp "$draft" "$target"
            echo "promoted  ${target}"
            promoted=$((promoted + 1))
          done
          echo "${promoted} scenario(s) promoted"

      - name: Record
        env:
          TFPFGEN_PROBE_TOKEN: ${{ secrets.TFPFGEN_PROBE_TOKEN }}
          TFPFGEN_PROBE_ENDPOINT: ${{ secrets.TFPFGEN_PROBE_ENDPOINT }}
          ONLY: ${{ inputs.probe_only_this_resource }}
          FORCE: ${{ inputs.probe_re_record_existing }}
        run: |
          ARGS=(-blueprint "${BLUEPRINT_DIR}" -allow-mutations \
                -profile ".tfpfgen/sandbox/${PROVIDER_NAME}.json" \
                -provider "${PROVIDER_NAME}")
          [ "${FORCE}" = "true" ] && ARGS+=(-force)
          failures=0
          if [ -n "${ONLY}" ]; then
            keys="${ONLY}"
          else
            keys=$(ls "${BLUEPRINT_DIR}"/*.scenario.json 2>/dev/null \
              | xargs -n1 basename 2>/dev/null | sed 's/\.scenario\.json$//')
            if [ -z "$keys" ]; then
              echo "no scenarios exist; nothing can be recorded"
              exit 0
            fi
          fi
          for key in $keys; do
            echo "::group::🔬 probe record ${key}"
            if ! tfpfgen probe record "${ARGS[@]}" -resource "$key"; then
              echo "::warning::${key}: recording failed; see the group above"
              failures=$((failures + 1))
            fi
            echo "::endgroup::"
          done
          echo "${failures} resource(s) failed to record"

      - name: Remove the sandbox profile
        if: always()
        run: rm -rf .tfpfgen/sandbox

      - name: Hand the evidence to the generate job
        # Jobs do not share a filesystem, so what the probe recorded travels as
        # an artifact rather than as a commit. The generate job unpacks it over
        # its own checkout and folds it in, which is what puts the evidence and
        # the provider it changes in one pull request.
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: probe-evidence
          path: |
            recordings/
            blueprints/*/*.scenario.json
          if-no-files-found: ignore
          retention-days: 7

  # ---------------------------------------------------------------------------
  # Derive the whole provider from committed state, plus whatever the probe just
  # recorded. Runs whether or not the probe ran: skipped is not failed.
  # ---------------------------------------------------------------------------
  generate:
    name: '⚙️ Generate the provider'
    needs: probe
    if: ${{ !cancelled() && (needs.probe.result == 'success' || needs.probe.result == 'skipped') }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - name: Check Out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Read config.json
        # The one file a person edits. Everything the pipeline needs to know
        # about this API lives here, committed and reviewable, rather than in a
        # dispatch form somebody retypes each run -- a setting typed per run is
        # a setting that will one day be typed wrong.
        env:
          REPO_NAME: ${{ github.event.repository.name }}
          TFPFGEN_OVERRIDE: ${{ inputs.tfpfgen_version_override }}
        run: |
          if [ ! -f config.json ]; then
            echo "::error::config.json is missing. It names the API document to generate from; see CONFIGURING.md"
            exit 1
          fi
          if ! jq empty config.json 2>/dev/null; then
            echo "::error::config.json is not valid JSON"
            exit 1
          fi

          NAME=$(jq -r '.provider.name // empty' config.json)
          NAME="${NAME:-${REPO_NAME#terraform-provider-}}"

          DOC_URL=$(jq -r '.openapi.documentUrl // empty' config.json)
          if [ -z "${DOC_URL}" ] || [ "${DOC_URL}" = "PLACEHOLDER" ]; then
            if [ ! -d "openapi/${NAME}" ]; then
              echo "::error::config.json does not name an OpenAPI document (openapi.documentUrl) and no snapshot is pinned yet; see CONFIGURING.md"
              exit 1
            fi
            # Already pinned once: the snapshot records where it came from, so
            # an empty URL means "re-fetch from that" rather than an error.
            DOC_URL=""
          fi

          {
            echo "PROVIDER_NAME=${NAME}"
            echo "OPENAPI_DIR=openapi/${NAME}"
            echo "BLUEPRINT_DIR=blueprints/${NAME}"
            echo "OPENAPI_URL=${DOC_URL}"
            echo "SDK_CLIENT_NAME=$(jq -r '.sdk.clientTypeName // "ApiClient"' config.json)"
            echo "SDK_INCLUDE=$(jq -r '(.sdk.includeOnlyPaths // []) | join(",")' config.json)"
            echo "SDK_EXCLUDE=$(jq -r '(.sdk.skipPaths // []) | join(",")' config.json)"
            echo "KIOTA_VERSION=$(jq -r '.sdk.kiotaVersion // empty' config.json)"
            echo "KIOTA_SHA256=$(jq -r '.sdk.kiotaDownloadChecksum // empty' config.json)"
            echo "TFPFGEN_REF=${TFPFGEN_OVERRIDE:-$(jq -r '.generator.version // "main"' config.json)}"
            echo "PROBE_NAME_PREFIX=$(jq -r '.probe.namePrefix // "tfpfgen-probe"' config.json)"
            echo "PROBE_MAX_OBJECTS=$(jq -r '.probe.maxExistingObjects // 25' config.json)"
            echo "PROBE_SCOPE_PARAM=$(jq -r '.probe.accountScopeParam // empty' config.json)"
            echo "PROBE_SCOPE_JSONPATH=$(jq -r '.probe.accountScopeJsonPath // empty' config.json)"
            echo "PROBE_AUTH_METHOD=$(jq -r '.probe.authMethod // "bearerToken"' config.json)"
            echo "PROBE_TOKEN_URL=$(jq -r '.probe.tokenUrl // .auth.tokenUrl // empty' config.json)"
            echo "PROBE_SECRET_TOKEN=$(jq -r '.probe.secrets.token // "TFPFGEN_PROBE_TOKEN"' config.json)"
            echo "PROBE_SECRET_CLIENT_ID=$(jq -r '.probe.secrets.clientId // "TFPFGEN_PROBE_CLIENT_ID"' config.json)"
            echo "PROBE_SECRET_CLIENT_SECRET=$(jq -r '.probe.secrets.clientSecret // "TFPFGEN_PROBE_CLIENT_SECRET"' config.json)"
            echo "PROBE_SECRET_USERNAME=$(jq -r '.probe.secrets.username // "TFPFGEN_PROBE_USERNAME"' config.json)"
            echo "PROBE_SECRET_PASSWORD=$(jq -r '.probe.secrets.password // "TFPFGEN_PROBE_PASSWORD"' config.json)"
          } >> "$GITHUB_ENV"
          echo "provider=${NAME} document=${DOC_URL:-<re-fetch from the pinned snapshot>}"

      - name: Take in the probe's evidence
        if: ${{ needs.probe.result == 'success' }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: probe-evidence
          path: .

      - name: Report what the probe contributed
        if: ${{ needs.probe.result == 'success' }}
        run: |
          echo "recordings now present: $(find "recordings/${PROVIDER_NAME}" -name facts.json 2>/dev/null | wc -l)"
          git status --porcelain "recordings" "${BLUEPRINT_DIR}" | sed 's/^/  /' || true

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Install tfpfgen
        env:
          # Straight from the repository, not through the module proxy: the
          # proxy caches a branch's resolution for up to half an hour, and a
          # pipeline that installs its own generator must track the ref's tip,
          # not whatever the cache last saw. GOPRIVATE also skips the checksum
          # database, which lags fresh commits the same way.
          GOPRIVATE: github.com/deploymenttheory/terraform-plugin-framework-codegen
        run: |
          go install "github.com/deploymenttheory/terraform-plugin-framework-codegen/cmd/tfpfgen@${TFPFGEN_REF}"
          tfpfgen version

      - name: Install kiota
        run: |
          if [ -z "${KIOTA_VERSION}" ]; then
            echo "::error::config.json names no sdk.kiotaVersion; see CONFIGURING.md"
            exit 1
          fi
          curl -sL -o /tmp/kiota.zip \
            "https://github.com/microsoft/kiota/releases/download/v${KIOTA_VERSION}/linux-x64.zip"
          DIGEST=$(sha256sum /tmp/kiota.zip | cut -d' ' -f1)
          echo "kiota v${KIOTA_VERSION} linux-x64 sha256: ${DIGEST}"
          if [ -n "${KIOTA_SHA256}" ] && [ "${DIGEST}" != "${KIOTA_SHA256}" ]; then
            echo "::error::kiota zip digest ${DIGEST} does not match the pinned ${KIOTA_SHA256}"
            exit 1
          fi
          mkdir -p "$HOME/kiota"
          unzip -q /tmp/kiota.zip -d "$HOME/kiota"
          chmod +x "$HOME/kiota/kiota"
          echo "$HOME/kiota" >> "$GITHUB_PATH"

      - name: Claim the module path (first run only)
        run: |
          if grep -q "terraform-provider-REPLACE_ME" go.mod; then
            go mod edit -module "github.com/${GITHUB_REPOSITORY}"
            echo "module path set to github.com/${GITHUB_REPOSITORY}"
          fi

      - name: Prime the Go module graph
        # The template ships go.mod without a go.sum -- there is no code yet to
        # derive one from -- and the SDK postcheck builds the generated tree,
        # which refuses without recorded checksums. Downloading the declared
        # module graph writes them.
        run: go mod download all

      - name: Pin the OpenAPI document
        run: |
          if [ -n "${OPENAPI_URL}" ]; then
            tfpfgen openapi fetch -url "${OPENAPI_URL}" -out "${OPENAPI_DIR}"
          elif [ -d "${OPENAPI_DIR}" ]; then
            # Re-fetch from the source the latest snapshot records; identical
            # upstream content pins nothing and the run continues quietly.
            tfpfgen openapi fetch -out "${OPENAPI_DIR}"
          else
            echo "::error::no pinned snapshot exists yet -- provide openapi_url on the first run"
            exit 1
          fi
          # Name the document version the rest of the run speaks about: the
          # newest snapshot by its own fetchedAt, not directory order.
          META=$(for f in "${OPENAPI_DIR}"/*/metadata.json; do
            printf '%s %s\n' "$(jq -r .fetchedAt "$f")" "$f"; done | sort | tail -1 | cut -d' ' -f2-)
          {
            echo "OPENAPI_VERSION=$(jq -r .version "$META")"
            echo "SNAPSHOT_NAME=$(basename "$(dirname "$META")")"
          } >> "$GITHUB_ENV"

      - name: Generate the SDK
        run: |
          ARGS=(-openapi-dir "${OPENAPI_DIR}" -out internal/sdk -client-name "${SDK_CLIENT_NAME}" -clean)
          [ -n "${SDK_INCLUDE}" ] && ARGS+=(-include "${SDK_INCLUDE}")
          [ -n "${SDK_EXCLUDE}" ] && ARGS+=(-exclude "${SDK_EXCLUDE}")
          # The postcheck builds the generated tree, and a new document version
          # can import modules go.mod does not yet require. The files are
          # already written when the postcheck refuses, so tidy against them
          # and regenerate -- the second run proves the tree builds clean.
          if ! tfpfgen sdk generate "${ARGS[@]}"; then
            echo "postcheck refused; tidying the module against the generated tree and retrying"
            go mod tidy
            tfpfgen sdk generate "${ARGS[@]}"
          fi

      - name: Derive the provider block
        # Nothing in the block is a choice -- the module path is go.mod's, the
        # client type is the SDK's own lock, the layout is the fixed convention,
        # and the source block restates the snapshot just pinned. -force because
        # the block is derived output: it changes exactly when its inputs do.
        run: |
          tfpfgen provider init -module . -name "${PROVIDER_NAME}" \
            -openapi-dir "${OPENAPI_DIR}" -out "${BLUEPRINT_DIR}" -force

      - name: Draft blueprints against the pinned SDK
        # Canonical names, written straight into the blueprint directory:
        # blueprints are generated artifacts now, not curated ones. -prune-module
        # resolves every drafted binding against the real SDK before anything is
        # written -- spellings the SDK carries under another canonical name are
        # repaired in place, shapes it cannot carry are pruned by name. What the
        # spec offers and the SDK cannot express is a named removal in this log,
        # not a hand edit.
        run: |
          # Drafting owns these two directories wholesale: a blueprint no run
          # would re-produce -- a renamed key, a family the spec dropped, a
          # curated leftover -- is stale state whose aliases and registrations
          # collide with the drafted set's. Ephemerals, actions and scenario
          # files live elsewhere and are untouched.
          find "${BLUEPRINT_DIR}/resources" "${BLUEPRINT_DIR}/datasources" \
            -name '*.blueprint.json' -delete 2>/dev/null || true
          tfpfgen blueprint draft -openapi-dir "${OPENAPI_DIR}" \
            -sdk-dialect kiotaFluent \
            -sdk-models-package "$(go list -m)/internal/sdk/models" \
            -out "${BLUEPRINT_DIR}" \
            -prune-module .

      - name: Fold recorded probe facts in
        # Recordings are the committed, replayable evidence of what the live API
        # actually does -- whatever this run's probe job just added, plus
        # everything earlier runs recorded. Absent recordings simply mean
        # spec-derived defaults.
        run: |
          if [ ! -d "recordings/${PROVIDER_NAME}" ]; then
            echo "no recordings committed; blueprints stay spec-derived until the probe records some"
            exit 0
          fi
          for facts in "recordings/${PROVIDER_NAME}"/*/*/facts.json; do
            [ -e "$facts" ] || continue
            # A recording that established nothing is a real outcome, not an
            # error: merge reports "nothing to do" and exits non-zero, which
            # would fail the run over a probe that simply found no facts.
            if [ "$(jq 'length' "$facts")" -eq 0 ]; then
              echo "skipping $facts (the recording established no facts)"
              continue
            fi
            echo "merging $facts"
            tfpfgen blueprint merge -blueprint "${BLUEPRINT_DIR}" \
              -facts "$facts" -strategy apply -allow-conflicts
          done

      - name: Check the bindings against the SDK
        run: tfpfgen bindings check -blueprint "${BLUEPRINT_DIR}" -module .

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # 4.0.1
        with:
          terraform_version: '1.12.1'
          terraform_wrapper: false

      - name: Scaffold the provider shell
        # Client, provider server, support and acceptance packages, from the
        # toolkit's templates, parameterised by the provider block. Generated
        # files with their own manifest entries -- an edit to any of them is
        # drift the next run reports.
        run: tfpfgen provider scaffold -blueprint "${BLUEPRINT_DIR}" -out .

      - name: Generate the provider
        run: |
          # examples/ is generated output; a file there without the marker is a
          # leftover from the scaffold-once era, and the overwrite refusal --
          # correctly -- will not touch it. Clearing unmarked files is the
          # adoption: the run regenerates every one of them, marked.
          if [ -d examples ]; then
            grep -rL "Code generated" examples --include='*.tf' --include='*.sh' 2>/dev/null \
              | xargs -r rm --
          fi
          # The postcheck builds the tree, regenerates the registry docs and
          # runs terraform fmt; generation can introduce imports go.mod does not
          # yet require, so tidy against the written files and regenerate -- the
          # second run proves the tree builds clean.
          if ! tfpfgen provider generate -blueprint "${BLUEPRINT_DIR}" -out . -clean; then
            echo "postcheck refused; tidying the module against the generated tree and retrying"
            go mod tidy
            tfpfgen provider generate -blueprint "${BLUEPRINT_DIR}" -out . -clean
          fi
          go mod tidy
          go build ./...
          TF_ACC=0 go test -p 8 -timeout 15m ./... -run '^TestUnit'

      - name: Open a pull request with the results
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PROBED: ${{ needs.probe.result }}
        run: |
          if [[ -z $(git status --porcelain) ]]; then
            echo "✅ everything already matches the pinned inputs; nothing to propose"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # One branch per provider, force-pushed: a rerun updates the open
          # pull request instead of minting a sibling per run id.
          BRANCH="tfpfgen/generate-${PROVIDER_NAME}"
          git checkout -B "$BRANCH"
          git add -A
          EVIDENCE="Blueprints carry the facts from the recordings already committed."
          if [ "${PROBED}" = "success" ]; then
            EVIDENCE="This run probed the live API first; the recordings it made are in this branch, and their facts are folded into the blueprints."
          fi
          git commit -m "Generate ${PROVIDER_NAME} from OpenAPI ${OPENAPI_VERSION}" \
            -m "tfpfgen pipeline run ${GITHUB_RUN_ID} against snapshot ${SNAPSHOT_NAME}. Everything follows from the pinned snapshot, the SDK's lock and the committed recordings; nothing is hand-written. ${EVIDENCE}"
          git push --force origin "HEAD:$BRANCH"
          BODY=$(printf 'Automated run of the tfpfgen pipeline (run %s).\n\n- OpenAPI document: version `%s`, snapshot `%s`\n- SDK: kiota, client `%s`, settings from the committed lock\n- Blueprints: `%s`, drafted and pruned against the SDK\n- Evidence: %s\n- Shell and provider tree: generated, drift-policed\n\nOne run, one pull request: document, SDK, provider block, blueprints, shell and provider, built and unit-tested on the runner. This branch is generator-owned and force-pushed on rerun.' \
            "${GITHUB_RUN_ID}" "${OPENAPI_VERSION}" "${SNAPSHOT_NAME}" "${SDK_CLIENT_NAME}" "${BLUEPRINT_DIR}" "${EVIDENCE}")
          gh pr create --base "${GITHUB_REF_NAME}" --head "$BRANCH" \
            --title "tfpfgen: generate ${PROVIDER_NAME} from OpenAPI ${OPENAPI_VERSION}" \
            --body "$BODY" \
            || { echo "PR already open for $BRANCH; refreshing its title and body"
                 gh pr edit "$BRANCH" --title "tfpfgen: generate ${PROVIDER_NAME} from OpenAPI ${OPENAPI_VERSION}" --body "$BODY"; }
