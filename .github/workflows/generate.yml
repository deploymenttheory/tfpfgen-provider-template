# The tfpfgen pipeline, whole. Point it at an OpenAPI document once; every run
# after that re-derives the entire tree from committed state -- the pinned
# snapshot, the SDK's own lock, go.mod and the recordings -- with nothing typed
# from memory and nothing curated by hand. Every run lands as a pull request;
# nothing is committed to the default branch directly.
#
# The chain, in order: pin the document, generate the SDK, derive the provider
# block, draft blueprints pruned against the real SDK, fold recorded probe
# facts in, check the bindings, scaffold the shell, generate the provider, and
# build and test what came out. The dispatch inputs that used to carry the SDK
# settings are overrides now: the committed kiota-lock.json is the source of
# truth, because a value a human retypes per run is a value that will one day
# be typed wrong.
name: tfpfgen | Generate

on:
  workflow_dispatch:
    inputs:
      provider_name:
        description: 'Provider name. Defaults to the repository name minus terraform-provider-. Names openapi/<name> and blueprints/<name>.'
        required: false
        type: string
      openapi_url:
        description: 'OpenAPI document URL. Required on the first run; omit later to re-fetch from the pinned source.'
        required: false
        type: string
      sdk_client_name:
        description: 'Root client type name (kiota -c). Defaults to the committed kiota-lock.json''s clientClassName; ApiClient on a first run with no lock.'
        required: false
        type: string
      sdk_include:
        description: 'Restrict the SDK to these API path globs (comma-separated). Defaults to the committed lock''s includePatterns.'
        required: false
        type: string
      sdk_exclude:
        description: 'Drop these API path globs from the SDK (comma-separated). Defaults to the committed lock''s excludePatterns.'
        required: false
        type: string
      tfpfgen_ref:
        description: 'tfpfgen version to install (a tag, branch or commit of terraform-plugin-framework-codegen).'
        required: false
        default: main
        type: string
      kiota_version:
        description: 'kiota release to install. Defaults to the committed kiota-lock.json''s kiotaVersion; required on a first run with no lock.'
        required: false
        type: string
      kiota_sha256:
        description: 'sha256 of the kiota linux-x64 release zip. Verified when set; the run prints the computed digest either way, so pin it from the first run''s log.'
        required: false
        type: string

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: tfpfgen-generate-${{ github.repository }}
  cancel-in-progress: false

jobs:
  generate:
    name: '⚙️ Generate from the OpenAPI document'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - name: Check Out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Resolve the provider name
        env:
          INPUT_NAME: ${{ inputs.provider_name }}
          REPO_NAME: ${{ github.event.repository.name }}
        run: |
          NAME="${INPUT_NAME:-${REPO_NAME#terraform-provider-}}"
          {
            echo "PROVIDER_NAME=${NAME}"
            echo "OPENAPI_DIR=openapi/${NAME}"
            echo "BLUEPRINT_DIR=blueprints/${NAME}"
          } >> "$GITHUB_ENV"

      # The committed lock is the source of truth for how the SDK was generated;
      # the dispatch inputs override it, and a first run with no lock falls back
      # to them. Deriving these here is what makes a default dispatch reproduce
      # main instead of depending on what somebody remembered to type.
      - name: Resolve the SDK settings from the committed lock
        env:
          IN_CLIENT: ${{ inputs.sdk_client_name }}
          IN_INCLUDE: ${{ inputs.sdk_include }}
          IN_EXCLUDE: ${{ inputs.sdk_exclude }}
          IN_KIOTA: ${{ inputs.kiota_version }}
        run: |
          LOCK=internal/sdk/kiota-lock.json
          CLIENT="" INCLUDE="" EXCLUDE="" KIOTA=""
          if [ -f "$LOCK" ]; then
            CLIENT=$(jq -r '.clientClassName // empty' "$LOCK")
            INCLUDE=$(jq -r '(.includePatterns // []) | join(",")' "$LOCK")
            EXCLUDE=$(jq -r '(.excludePatterns // []) | join(",")' "$LOCK")
            KIOTA=$(jq -r '.kiotaVersion // empty' "$LOCK" | cut -d'-' -f1)
          fi
          CLIENT="${IN_CLIENT:-${CLIENT:-ApiClient}}"
          INCLUDE="${IN_INCLUDE:-${INCLUDE}}"
          EXCLUDE="${IN_EXCLUDE:-${EXCLUDE}}"
          KIOTA="${IN_KIOTA:-${KIOTA}}"
          if [ -z "$KIOTA" ]; then
            echo "::error::no committed kiota-lock.json and no kiota_version input -- one of them must name the release"
            exit 1
          fi
          {
            echo "SDK_CLIENT_NAME=${CLIENT}"
            echo "SDK_INCLUDE=${INCLUDE}"
            echo "SDK_EXCLUDE=${EXCLUDE}"
            echo "KIOTA_VERSION=${KIOTA}"
          } >> "$GITHUB_ENV"
          echo "client=${CLIENT} include=${INCLUDE:-<none>} exclude=${EXCLUDE:-<none>} kiota=${KIOTA}"

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Install tfpfgen
        env:
          REF: ${{ inputs.tfpfgen_ref }}
          # Straight from the repository, not through the module proxy: the
          # proxy caches a branch's resolution for up to half an hour, and a
          # pipeline that installs its own generator must track the ref's tip,
          # not whatever the cache last saw. GOPRIVATE also skips the checksum
          # database, which lags fresh commits the same way.
          GOPRIVATE: github.com/deploymenttheory/terraform-plugin-framework-codegen
        run: |
          go install "github.com/deploymenttheory/terraform-plugin-framework-codegen/cmd/tfpfgen@${REF}"
          tfpfgen version

      - name: Install kiota
        env:
          KIOTA_SHA256: ${{ inputs.kiota_sha256 }}
        run: |
          curl -sL -o /tmp/kiota.zip \
            "https://github.com/microsoft/kiota/releases/download/v${KIOTA_VERSION}/linux-x64.zip"
          DIGEST=$(sha256sum /tmp/kiota.zip | cut -d' ' -f1)
          echo "kiota v${KIOTA_VERSION} linux-x64 sha256: ${DIGEST}"
          if [ -n "${KIOTA_SHA256}" ] && [ "${DIGEST}" != "${KIOTA_SHA256}" ]; then
            echo "::error::kiota zip digest ${DIGEST} does not match the pinned ${KIOTA_SHA256}"
            exit 1
          fi
          mkdir -p "$HOME/kiota"
          unzip -q /tmp/kiota.zip -d "$HOME/kiota"
          chmod +x "$HOME/kiota/kiota"
          echo "$HOME/kiota" >> "$GITHUB_PATH"

      - name: Claim the module path (first run only)
        run: |
          if grep -q "terraform-provider-REPLACE_ME" go.mod; then
            go mod edit -module "github.com/${GITHUB_REPOSITORY}"
            echo "module path set to github.com/${GITHUB_REPOSITORY}"
          fi

      - name: Prime the Go module graph
        # The template ships go.mod without a go.sum -- there is no code yet to
        # derive one from -- and the SDK postcheck builds the generated tree,
        # which refuses without recorded checksums. Downloading the declared
        # module graph writes them.
        run: go mod download all

      - name: Pin the OpenAPI document
        env:
          OPENAPI_URL: ${{ inputs.openapi_url }}
        run: |
          if [ -n "${OPENAPI_URL}" ]; then
            tfpfgen openapi fetch -url "${OPENAPI_URL}" -out "${OPENAPI_DIR}"
          elif [ -d "${OPENAPI_DIR}" ]; then
            # Re-fetch from the source the latest snapshot records; identical
            # upstream content pins nothing and the run continues quietly.
            tfpfgen openapi fetch -out "${OPENAPI_DIR}"
          else
            echo "::error::no pinned snapshot exists yet -- provide openapi_url on the first run"
            exit 1
          fi
          # Name the document version the rest of the run speaks about: the
          # newest snapshot by its own fetchedAt, not directory order.
          META=$(for f in "${OPENAPI_DIR}"/*/metadata.json; do
            printf '%s %s\n' "$(jq -r .fetchedAt "$f")" "$f"; done | sort | tail -1 | cut -d' ' -f2-)
          {
            echo "OPENAPI_VERSION=$(jq -r .version "$META")"
            echo "SNAPSHOT_NAME=$(basename "$(dirname "$META")")"
          } >> "$GITHUB_ENV"

      - name: Generate the SDK
        run: |
          ARGS=(-openapi-dir "${OPENAPI_DIR}" -out internal/sdk -client-name "${SDK_CLIENT_NAME}" -clean)
          [ -n "${SDK_INCLUDE}" ] && ARGS+=(-include "${SDK_INCLUDE}")
          [ -n "${SDK_EXCLUDE}" ] && ARGS+=(-exclude "${SDK_EXCLUDE}")
          # The postcheck builds the generated tree, and a new document version
          # can import modules go.mod does not yet require. The files are
          # already written when the postcheck refuses, so tidy against them
          # and regenerate -- the second run proves the tree builds clean.
          if ! tfpfgen sdk generate "${ARGS[@]}"; then
            echo "postcheck refused; tidying the module against the generated tree and retrying"
            go mod tidy
            tfpfgen sdk generate "${ARGS[@]}"
          fi

      - name: Derive the provider block
        # Nothing in the block is a choice -- the module path is go.mod's, the
        # client type is the SDK's own lock, the layout is the fixed convention,
        # and the source block restates the snapshot just pinned. -force because
        # the block is derived output: it changes exactly when its inputs do.
        run: |
          tfpfgen provider init -module . -name "${PROVIDER_NAME}" \
            -openapi-dir "${OPENAPI_DIR}" -out "${BLUEPRINT_DIR}" -force

      - name: Draft blueprints against the pinned SDK
        # Canonical names, written straight into the blueprint directory:
        # blueprints are generated artifacts now, not curated ones. -prune-module
        # resolves every drafted binding against the real SDK before anything is
        # written -- spellings the SDK carries under another canonical name are
        # repaired in place, shapes it cannot carry are pruned by name. What the
        # spec offers and the SDK cannot express is a named removal in this log,
        # not a hand edit.
        run: |
          # Drafting owns these two directories wholesale: a blueprint no run
          # would re-produce -- a renamed key, a family the spec dropped, a
          # curated leftover -- is stale state whose aliases and registrations
          # collide with the drafted set's. Ephemerals, actions and scenario
          # files live elsewhere and are untouched.
          find "${BLUEPRINT_DIR}/resources" "${BLUEPRINT_DIR}/datasources" \
            -name '*.blueprint.json' -delete 2>/dev/null || true
          tfpfgen blueprint draft -openapi-dir "${OPENAPI_DIR}" \
            -sdk-dialect kiotaFluent \
            -sdk-models-package "$(go list -m)/internal/sdk/models" \
            -out "${BLUEPRINT_DIR}" \
            -prune-module .

      - name: Fold recorded probe facts in
        # Recordings are the committed, replayable evidence of what the live API
        # actually does; merge folds their facts into the drafted blueprints.
        # Absent recordings simply mean spec-derived defaults -- the probe
        # workflow supplies the evidence on its own cadence.
        run: |
          if [ ! -d "recordings/${PROVIDER_NAME}" ]; then
            echo "no recordings committed; blueprints stay spec-derived until the probe workflow lands some"
            exit 0
          fi
          for facts in "recordings/${PROVIDER_NAME}"/*/*/facts.json; do
            [ -e "$facts" ] || continue
            # A recording that established nothing is a real outcome, not an
            # error: merge reports "nothing to do" and exits non-zero, which
            # would fail the run over a probe that simply found no facts.
            if [ "$(jq 'length' "$facts")" -eq 0 ]; then
              echo "skipping $facts (the recording established no facts)"
              continue
            fi
            echo "merging $facts"
            tfpfgen blueprint merge -blueprint "${BLUEPRINT_DIR}" \
              -facts "$facts" -strategy apply -allow-conflicts
          done

      - name: Check the bindings against the SDK
        run: tfpfgen bindings check -blueprint "${BLUEPRINT_DIR}" -module .

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # 4.0.1
        with:
          terraform_version: '1.12.1'
          terraform_wrapper: false

      - name: Scaffold the provider shell
        # Client, provider server, support and acceptance packages, from the
        # toolkit's templates, parameterised by the provider block. Generated
        # files with their own manifest entries -- an edit to any of them is
        # drift the next run reports.
        run: tfpfgen provider scaffold -blueprint "${BLUEPRINT_DIR}" -out .

      - name: Generate the provider
        run: |
          # examples/ is generated output; a file there without the marker is a
          # leftover from the scaffold-once era, and the overwrite refusal --
          # correctly -- will not touch it. Clearing unmarked files is the
          # adoption: the run regenerates every one of them, marked.
          if [ -d examples ]; then
            grep -rL "Code generated" examples --include='*.tf' --include='*.sh' 2>/dev/null \
              | xargs -r rm --
          fi
          # The postcheck builds the tree, regenerates the registry docs and
          # runs terraform fmt; generation can introduce imports go.mod does not
          # yet require, so tidy against the written files and regenerate -- the
          # second run proves the tree builds clean.
          if ! tfpfgen provider generate -blueprint "${BLUEPRINT_DIR}" -out . -clean; then
            echo "postcheck refused; tidying the module against the generated tree and retrying"
            go mod tidy
            tfpfgen provider generate -blueprint "${BLUEPRINT_DIR}" -out . -clean
          fi
          go mod tidy
          go build ./...
          TF_ACC=0 go test -p 8 -timeout 15m ./... -run '^TestUnit'

      - name: Open a pull request with the results
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [[ -z $(git status --porcelain) ]]; then
            echo "✅ everything already matches the pinned inputs; nothing to propose"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # One branch per provider, force-pushed: a rerun updates the open
          # pull request instead of minting a sibling per run id.
          BRANCH="tfpfgen/generate-${PROVIDER_NAME}"
          git checkout -B "$BRANCH"
          git add -A
          git commit -m "Generate ${PROVIDER_NAME} from OpenAPI ${OPENAPI_VERSION}" \
            -m "tfpfgen pipeline run ${GITHUB_RUN_ID} against snapshot ${SNAPSHOT_NAME}. Everything follows from the pinned snapshot, the SDK's lock and the committed recordings; nothing is hand-written."
          git push --force origin "HEAD:$BRANCH"
          BODY=$(printf 'Automated run of the tfpfgen pipeline (run %s).\n\n- OpenAPI document: version `%s`, snapshot `%s`\n- SDK: kiota, client `%s`, settings from the committed lock\n- Blueprints: `%s`, drafted and pruned against the SDK, probe facts folded from `recordings/`\n- Shell and provider tree: generated, drift-policed\n\nOne run, one pull request: document, SDK, provider block, blueprints, shell and provider, built and unit-tested on the runner. This branch is generator-owned and force-pushed on rerun.' \
            "${GITHUB_RUN_ID}" "${OPENAPI_VERSION}" "${SNAPSHOT_NAME}" "${SDK_CLIENT_NAME}" "${BLUEPRINT_DIR}")
          gh pr create --base "${GITHUB_REF_NAME}" --head "$BRANCH" \
            --title "tfpfgen: generate ${PROVIDER_NAME} from OpenAPI ${OPENAPI_VERSION}" \
            --body "$BODY" \
            || { echo "PR already open for $BRANCH; refreshing its title and body"
                 gh pr edit "$BRANCH" --title "tfpfgen: generate ${PROVIDER_NAME} from OpenAPI ${OPENAPI_VERSION}" --body "$BODY"; }
