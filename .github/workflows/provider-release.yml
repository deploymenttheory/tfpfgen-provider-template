# Adapted from deploymenttheory/terraform-provider-microsoft365. Requires two
# repository secrets before the first release: GPG_PRIVATE_KEY and (if the key
# has one) GPG_PRIVATE_KEY_PASSPHRASE -- the Terraform Registry requires
# signed checksums.
name: provider | Terraform Provider Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_version:
        description: 'TF Provider Release version to publish. Requires a pre-existing tag, formatted as a semver (e.g. v0.1.0).'
        required: true
        default: 'v0.0.0-alpha'

permissions:
  contents: write
  id-token: write
  packages: read
  statuses: write

jobs:
  pre-release-checks:
    name: '🚦 Pre-release Validation'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.event.inputs.release_version || github.ref }}

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          cache: true
          cache-dependency-path: 'go.sum'
          go-version-file: 'go.mod'

      - name: Run 'go mod tidy' and check for differences
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum || \
          (echo; echo "Unexpected difference in go.mod/go.sum files. Run 'go mod tidy' and commit."; exit 1)

      - name: Go build
        run: go build -v .
        env:
          CGO_ENABLED: 0

  terraform-provider-release:
    name: '📦 Terraform Provider Release'
    needs: [pre-release-checks]
    uses: ./.github/workflows/tf-registry-goreleaser.yml
    secrets:
      gpg-private-key: '${{ secrets.GPG_PRIVATE_KEY }}'
      gpg-private-key-passphrase: '${{ secrets.GPG_PRIVATE_KEY_PASSPHRASE }}'
    with:
      goreleaser-release-args: --verbose --timeout 120m0s
      setup-go-version-file: 'go.mod'
      git-ref: ${{ github.event.inputs.release_version || github.ref }}
